name: Build Hafiz APK

on:
  push:
    branches: [ 'claude/*', main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: hafiz_app
        run: flutter pub get

      - name: Build APK
        working-directory: hafiz_app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      - name: Rename APK
        run: cp hafiz_app/build/app/outputs/flutter-apk/app-release.apk hafiz-latest.apk

      - name: Delete existing latest tag
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Hafiz App - Derniere version"
          body: |
            ## Hafiz - Compagnon d'apprentissage du Coran

            Cliquez sur **hafiz-latest.apk** pour telecharger.

            **Installation Android :**
            1. Telechargez hafiz-latest.apk
            2. Parametres > Securite > Autoriser sources inconnues
            3. Ouvrez le fichier pour installer

            Build: ${{ github.sha }}
          files: hafiz-latest.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
