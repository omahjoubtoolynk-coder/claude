name: Build Hafiz APK

on:
  push:
    branches: [ 'claude/*', main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter info
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== FLUTTER_ROOT ==="
          echo "$FLUTTER_ROOT"
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"

      - name: Get dependencies
        working-directory: hafiz_app
        run: flutter pub get

      - name: Configure local.properties
        working-directory: hafiz_app/android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "=== local.properties ==="
          cat local.properties

      - name: Build APK
        working-directory: hafiz_app
        run: flutter build apk --release

      - name: Check & copy APK
        run: |
          APK=hafiz_app/build/app/outputs/flutter-apk/app-release.apk
          echo "=== APK info ==="
          ls -la "$APK"
          cp "$APK" hafiz-latest.apk
          echo "APK size: $(du -h hafiz-latest.apk | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz-latest.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "hafiz-latest.apk"
          tag: latest
          name: "Hafiz - Compagnon du Coran"
          body: |
            ## Hafiz - Application d'apprentissage du Coran

            Telechargez **hafiz-latest.apk** ci-dessous pour installer sur Android.

            ### Fonctionnalites
            - Dashboard de progression quotidienne et hebdomadaire
            - 114 sourates avec texte arabe + traduction francaise
            - Ecoute des recitations audio
            - Correction IA de votre recitation
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Verifying release ==="
          gh release list --repo ${{ github.repository }} || echo "WARNING: gh release list failed"
          echo "=== Done ==="
