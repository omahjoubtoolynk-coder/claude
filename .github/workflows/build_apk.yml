name: Build Hafiz APK

on:
  push:
    branches: [ 'claude/*', main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: hafiz_app
        run: flutter pub get

      - name: Build APK
        working-directory: hafiz_app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      - name: Prepare APK
        run: |
          APK=hafiz_app/build/app/outputs/flutter-apk/app-release.apk
          ls -la $APK
          cp $APK hafiz-latest.apk
          echo "APK size: $(du -h hafiz-latest.apk)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz-latest.apk
          retention-days: 30

      - name: Publish Release via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          API="https://api.github.com"

          echo "Deleting old release/tag if exists..."
          OLD_ID=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" \
            "$API/repos/$REPO/releases/tags/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$OLD_ID" ]; then
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "$API/repos/$REPO/releases/$OLD_ID" || true
          fi
          curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
            "$API/repos/$REPO/git/refs/tags/latest" || true

          echo "Creating release..."
          RELEASE=$(curl -sf -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "{\"tag_name\":\"latest\",\"target_commitish\":\"$SHA\",\"name\":\"Hafiz - Compagnon du Coran\",\"body\":\"Telechargez **hafiz-latest.apk** ci-dessous pour installer sur Android.\",\"draft\":false,\"prerelease\":false}")

          echo "Release response: $RELEASE"

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['upload_url'].split('{')[0])")

          echo "Uploading APK to: $UPLOAD_URL"
          curl -sf -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=hafiz-latest.apk" \
            --data-binary @hafiz-latest.apk

          echo "Release published successfully!"
