name: Build Hafiz APK

on:
  push:
    branches: [ 'claude/*', main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter info
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== Dart Version ==="
          dart --version

      - name: Get dependencies
        working-directory: hafiz_app
        run: |
          echo "=== Running flutter pub get ==="
          flutter pub get
          echo "=== pub get done ==="

      - name: Analyze code
        working-directory: hafiz_app
        run: flutter analyze --no-fatal-infos 2>&1 || true

      - name: Build APK
        working-directory: hafiz_app
        run: |
          echo "=== Starting APK build ==="
          flutter build apk --release 2>&1
          echo "=== Build exit code: $? ==="

      - name: Check APK
        run: |
          APK=hafiz_app/build/app/outputs/flutter-apk/app-release.apk
          echo "=== Checking APK ==="
          ls -la $APK
          cp $APK hafiz-latest.apk
          echo "=== APK size: $(du -h hafiz-latest.apk) ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz-latest.apk
          retention-days: 30

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: hafiz-latest.apk
          tag: latest
          name: "Hafiz - Compagnon du Coran"
          body: "Telechargez **hafiz-latest.apk** ci-dessous pour installer sur Android."
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Verifying release ==="
          gh release list
          echo "=== Done ==="
