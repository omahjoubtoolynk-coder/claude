name: Build Hafiz APK

on:
  push:
    branches: [ 'claude/*', main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: hafiz_app
        run: flutter pub get

      - name: Build APK
        working-directory: hafiz_app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      - name: Prepare APK
        run: cp hafiz_app/build/app/outputs/flutter-apk/app-release.apk hafiz-latest.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafiz-apk
          path: hafiz-latest.apk
          retention-days: 30

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest hafiz-latest.apk \
            --title "Hafiz - Compagnon du Coran" \
            --notes "Telechargez hafiz-latest.apk ci-dessous pour installer sur Android. Installation: Parametres > Securite > Sources inconnues, puis ouvrez le fichier APK."
